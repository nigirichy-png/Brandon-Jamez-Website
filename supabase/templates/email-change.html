<!doctype html>
<html lang="en">
  <body style="margin:0;background:#07090d;color:#f5f7fb;font-family:Arial,sans-serif">
    <div style="max-width:560px;margin:0 auto;padding:40px 24px">
      <p style="margin:0 0 28px;color:#55e7ff;font-size:13px;font-weight:700;letter-spacing:1.5px">BRANDON JAMEZ</p>
      <h1 style="margin:0 0 14px;font-size:28px;line-height:1.2">Confirm your email change</h1>
      <p style="margin:0 0 24px;color:#b8c0cf;font-size:16px;line-height:1.6">Confirm the change to <strong style="color:#f5f7fb">{{ .NewEmail }}</strong>. For security, both the current and new address may need confirmation.</p>
      <a href="{{ .SiteURL }}/auth/confirm?token_hash={{ .TokenHash }}&amp;type=email_change" style="display:inline-block;padding:12px 18px;background:#f5f7fb;color:#07090d;font-size:14px;font-weight:700;text-decoration:none">Confirm email change</a>
      <p style="margin:28px 0 0;color:#747e91;font-size:13px;line-height:1.6">If you did not request this change, do not use the link and secure your account.</p>
    </div>
  </body>
</html>
